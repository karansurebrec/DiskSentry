name: Build Windows EXE

# Builds DiskSentry.exe from source on every tag (v*) — the exe is attached
# to the GitHub Release automatically. Can also be run manually
# (Actions -> Build Windows EXE -> Run workflow); the exe shows up under
# the run's "Artifacts" section.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write   # required to attach DiskSentry.exe to the Release
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build DiskSentry.exe
        run: python -m PyInstaller --clean --noconfirm DiskSentry.spec

      - name: Upload exe as artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiskSentry-windows
          path: dist/DiskSentry.exe

      - name: Attach exe to the GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/DiskSentry.exe
